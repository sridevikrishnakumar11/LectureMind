<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiz | LectureMind</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><div class="site-shell"><nav class="glass-nav"><a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">LM</span><span>LectureMind</span></a><div class="nav-links"><a href="{{ url_for('view_lecture', lecture_id=lecture.id) }}">← Lecture</a><a class="nav-button" href="{{ url_for('logout') }}">Logout</a></div></nav><main class="quiz-page"><header class="page-heading compact-heading"><p class="eyebrow">Lecture Quiz</p><h1>{{ lecture.title }}</h1><p>{{ lecture.subject }}</p></header><form method="post" action="{{ url_for('submit_quiz', quiz_id=quiz.id) }}">{% for question in quiz.questions %}<section class="glass-panel question-card"><p class="eyebrow">Question {{ loop.index }} · {{ question.concept }}</p><h2>{{ question.question }}</h2><div class="options">{% for option in question.options %}<label><input required type="radio" name="{{ question.id }}" value="{{ option }}"><span>{{ option }}</span></label>{% endfor %}</div></section>{% endfor %}<button class="btn btn-primary" type="submit">Submit Quiz</button></form></main></div></body></html>
